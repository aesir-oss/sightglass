name: Fuzz

# Coverage-guided fuzzing of the archive unpacker with cargo-fuzz (nightly Rust). Not part of the merge gate:
# crashes found here are fixed and their inputs added to backend/fuzz/regressions/, which `pixi run ci` replays.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "600"
        required: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [unpack_zip, unpack_tar, unpack_tar_gz]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '600' }}
          TARGET: ${{ matrix.target }}
        run: bash backend/fuzz/run.sh "$TARGET" "$SECONDS_PER_TARGET"

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: backend/fuzz/artifacts/
          if-no-files-found: ignore
