# TCP pass-through from the internal network to the Supabase session pooler (SIGHTGLASS_DB_HOST:SIGHTGLASS_DB_PORT).
# The app negotiates TLS with Supabase through it; this proxy never sees the password or the queries.
global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 10s
    # The worker holds a LISTEN connection that can sit idle for hours.
    timeout client 24h
    timeout server 24h

resolvers docker
    parse-resolv-conf
    hold valid 60s

frontend postgres
    bind :5432
    default_backend supabase

backend supabase
    server supabase "${SIGHTGLASS_DB_HOST}:${SIGHTGLASS_DB_PORT}" resolvers docker init-addr last,libc,none
