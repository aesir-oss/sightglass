# Egress allowlist for the API and the workers: HTTPS CONNECT to the package index and source hosts, nothing else.
# Add a host here only when the code fetches from it (see PYPI_HOSTS and GITHUB_HOSTS in sightglass.ecosystems).
http_port 3128

acl allowed_hosts dstdomain pypi.org files.pythonhosted.org github.com codeload.github.com
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# A pass-through proxy: no caching, no identifying headers.
cache deny all
forwarded_for delete
via off

# The image's entrypoint tails these files to the container log.
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
shutdown_lifetime 3 seconds
