# Python tool configuration. Runtime dependencies live in the root pixi.toml.

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "sightglass"
version = "0.1.0"
description = "See what a package release actually ships."
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Kevin Mills", email = "millsks@gmail.com" }]

[tool.maturin]
manifest-path = "crates/sightglass-py/Cargo.toml"
python-source = "src"
module-name = "sightglass._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib --strict-markers"
markers = [
    "integration: marks tests as integration tests requiring real I/O, network, or DB",
    "e2e: browser tests of the built app served by FastAPI",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sightglass"]

[tool.mypy]
python_version = "3.14"   # the only supported version; see CLAUDE.md
strict = true
warn_return_any = true
warn_unused_configs = true
