[workspace]
resolver = "3"
members = ["crates/sightglass-core", "crates/sightglass-py"]
# The fuzz crate needs nightly Rust and has its own workspace; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kevin Mills <millsks@gmail.com>"]
repository = "https://github.com/aesir-oss/sightglass"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
