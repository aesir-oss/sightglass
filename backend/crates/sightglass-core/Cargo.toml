[package]
name = "sightglass-core"
description = "Archive unpacking, hashing, file typing and line diffs for Sightglass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }
