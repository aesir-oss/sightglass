# Alembic configuration. The database URL comes from SIGHTGLASS_DATABASE_URL (see sightglass.db.engine).
# No [loggers] sections: the project logs with structlog, and env.py doesn't call logging.config.

[alembic]
script_location = sightglass.db:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
