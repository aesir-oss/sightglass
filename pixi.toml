[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "sightglass"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.14.*"
structlog = ">=26.1.0,<27"
# Build the Rust extension from the environment, not an isolated build env.
rust = ">=1.99.0,<2"
maturin = ">=1.15.0,<2"

[pypi-dependencies]
sightglass = { path = "./backend", editable = true }

[pypi-options]
no-build-isolation = ["sightglass"]

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
cargo-llvm-cov = ">=0.9.1,<0.10"
llvm-tools = ">=23.1.3,<24"

[feature.lint.dependencies]
# Pinned to the pre-commit hook revisions so both runs agree.
ruff = "==0.17.1"
mypy = "==2.4.0"
pre-commit = ">=4.7.0,<5"

[feature.build.dependencies]
python-build = ">=1.6.1,<2"

[feature.dev.dependencies]
git-cliff = ">=2.14.2,<3"
act = ">=0.2.89,<0.3"

[environments]
default = ["test", "lint", "build", "dev"]

[tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Rebuild the Rust extension in place after Rust changes; the Python tasks depend on it.
develop = { cmd = "maturin develop --skip-install", cwd = "backend" }
fmt = { cmd = "ruff format .", cwd = "backend" }
lint = { cmd = "ruff check .", cwd = "backend" }
check = { cmd = "mypy src/", cwd = "backend" }
test = { cmd = "pytest tests/unit/", cwd = "backend", depends-on = ["develop"] }
test-integration = { cmd = "pytest tests/integration/", cwd = "backend", depends-on = ["develop"] }
cov = { cmd = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90", cwd = "backend", depends-on = [
    "develop",
] }
build = { cmd = "python -m build --no-isolation --outdir dist/", cwd = "backend" }
fmt-rs = { cmd = "cargo fmt --all", cwd = "backend" }
fmt-rs-check = { cmd = "cargo fmt --all --check", cwd = "backend" }
lint-rs = { cmd = "cargo clippy --workspace --all-targets -- -D warnings", cwd = "backend" }
test-rs = { cmd = "cargo test --workspace --exclude sightglass-py", cwd = "backend" }
# The bindings crate can't link libpython under cargo test; the Python tests cover it.
cov-rs = { cmd = "cargo llvm-cov --workspace --exclude sightglass-py --fail-under-lines 90", cwd = "backend" }
changelog = "git cliff -o CHANGELOG.md"
pre-commit = "pre-commit run --all-files"
act = "act --container-architecture linux/amd64"
ci = { depends-on = ["pre-commit", "build", "check", "lint", "fmt-rs-check", "lint-rs", "cov", "cov-rs"] }
