[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "sightglass"
# postgresql 18 (integration tests) needs macOS 13.3 or later.
platforms = [{ name = "macos-arm64", platform = "osx-arm64", macos = "13.3" }, "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.14.*"
structlog = ">=26.1.0,<27"
# Build the Rust extension from the environment, not an isolated build env.
rust = ">=1.99.0,<2"
maturin = ">=1.15.0,<2"
# `maturin develop` checks for pip even with --skip-install (fails on Linux CI without it); nothing installs with it.
pip = ">=26.2.1,<27"
# Node is a build tool for frontend/ only.
nodejs = "24.*"
pnpm = ">=12.4.1,<13"
fastapi = ">=0.143.3,<0.144"
sqlalchemy = ">=2.1.4,<2.2"
alembic = ">=1.20.0,<2"
psycopg = ">=3.3.4,<4"
httpx = ">=0.28.1,<0.29"
cryptography = ">=50.0.2,<51"
packaging = ">=26.3,<27"

[pypi-dependencies]
sightglass = { path = "./backend", editable = true }

[pypi-options]
no-build-isolation = ["sightglass"]

[feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
cargo-llvm-cov = ">=0.9.1,<0.10"
llvm-tools = ">=23.1.3,<24"
httpx2 = ">=2.13.1,<3"
postgresql = ">=18.6,<19"
respx = ">=0.23.1,<0.24"

[feature.lint.dependencies]
# Pinned to the pre-commit hook revisions so both runs agree.
ruff = "==0.17.1"
mypy = "==2.4.0"
pre-commit = ">=4.7.0,<5"

[feature.build.dependencies]
python-build = ">=1.6.1,<2"

[feature.dev.dependencies]
git-cliff = ">=2.14.2,<3"
act = ">=0.2.89,<0.3"

[environments]
default = ["test", "lint", "build", "dev"]

[tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Rebuild the Rust extension in place after Rust changes; the Python tasks depend on it.
develop = { cmd = "maturin develop --skip-install", cwd = "backend" }
fmt = { cmd = "ruff format .", cwd = "backend" }
lint = { cmd = "ruff check .", cwd = "backend" }
check = { cmd = "mypy src/", cwd = "backend" }
test = { cmd = "pytest tests/unit/", cwd = "backend", depends-on = ["develop"] }
test-integration = { cmd = "pytest tests/integration/", cwd = "backend", depends-on = ["develop"] }
cov = { cmd = "pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90", cwd = "backend", depends-on = [
    "develop",
] }
build = { cmd = "python -m build --no-isolation --outdir dist/", cwd = "backend" }
# Migrations; both need SIGHTGLASS_DATABASE_URL. Tests start their own throwaway Postgres instead.
# Refresh the top-packages list for the lookalike-name rule, then review and commit the diff.
refresh-top-packages = { cmd = "python -m sightglass.rules.top_packages", cwd = "backend", depends-on = ["develop"] }
db-upgrade = { cmd = "alembic upgrade head", cwd = "backend" }
db-revision = { cmd = "alembic revision --autogenerate", cwd = "backend" }
fmt-rs = { cmd = "cargo fmt --all", cwd = "backend" }
fmt-rs-check = { cmd = "cargo fmt --all --check", cwd = "backend" }
lint-rs = { cmd = "cargo clippy --workspace --all-targets -- -D warnings", cwd = "backend" }
test-rs = { cmd = "cargo test --workspace --exclude sightglass-py", cwd = "backend" }
# The bindings crate can't link libpython under cargo test; the Python tests cover it.
# Line diff benchmarks; not part of ci.
bench-rs = { cmd = "cargo bench -p sightglass-core", cwd = "backend" }
cov-rs = { cmd = "cargo llvm-cov --workspace --exclude sightglass-py --fail-under-lines 90", cwd = "backend" }
# Fuzzing needs rustup's nightly toolchain and cargo-fuzz, outside pixi; see backend/fuzz/README.md.
# New inputs go to backend/fuzz/work (ignored); corpus/ is the committed seed set.
fuzz-zip = { cmd = "bash run.sh unpack_zip {{ seconds }}", cwd = "backend/fuzz", args = [{ arg = "seconds", default = "60" }] }
fuzz-tar = { cmd = "bash run.sh unpack_tar {{ seconds }}", cwd = "backend/fuzz", args = [{ arg = "seconds", default = "60" }] }
fuzz-tar-gz = { cmd = "bash run.sh unpack_tar_gz {{ seconds }}", cwd = "backend/fuzz", args = [{ arg = "seconds", default = "60" }] }
fuzz = { depends-on = ["fuzz-zip", "fuzz-tar", "fuzz-tar-gz"] }
fuzz-seeds = { cmd = "bash run.sh seeds", cwd = "backend/fuzz" }
install-web = { cmd = "pnpm install --frozen-lockfile", cwd = "frontend" }
dev-web = { cmd = "pnpm run dev", cwd = "frontend", depends-on = ["install-web"] }
fmt-web = { cmd = "pnpm run fmt", cwd = "frontend", depends-on = ["install-web"] }
fmt-web-check = { cmd = "pnpm run fmt:check", cwd = "frontend", depends-on = ["install-web"] }
lint-web = { cmd = "pnpm run lint", cwd = "frontend", depends-on = ["install-web"] }
check-web = { cmd = "pnpm run check", cwd = "frontend", depends-on = ["install-web"] }
test-web = { cmd = "pnpm run test", cwd = "frontend", depends-on = ["install-web"] }
cov-web = { cmd = "pnpm run cov", cwd = "frontend", depends-on = ["install-web"] }
build-web = { cmd = "pnpm run build", cwd = "frontend", depends-on = ["install-web"] }
# API contract: export the FastAPI schema, generate frontend types, and fail CI if the committed copies are stale.
openapi = { cmd = "python -m sightglass.api.openapi ../frontend/src/api/openapi.json", cwd = "backend" }
gen-api-types = { cmd = "pnpm run gen:api", cwd = "frontend", depends-on = ["openapi", "install-web"] }
check-api-types = { cmd = "git diff --exit-code -- frontend/src/api", depends-on = ["gen-api-types"] }
changelog = "git cliff -o CHANGELOG.md"
pre-commit = "pre-commit run --all-files"
act = "act --container-architecture linux/amd64"
ci = { depends-on = [
    "pre-commit",
    "build",
    "build-web",
    "check",
    "check-web",
    "check-api-types",
    "lint",
    "lint-web",
    "fmt-rs-check",
    "lint-rs",
    "fmt-web-check",
    "cov",
    "cov-rs",
    "cov-web",
] }
